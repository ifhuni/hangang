<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전체 업체 목록 - 한강웹</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; font-size: 14px; }
        th { background: #f5f5f5; }
        .status { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .status-PENDING { background: #f1c40f33; color: #b7950b; }
        .status-APPROVED { background: #2ecc7133; color: #1e8449; }
        .status-REJECTED { background: #e74c3c33; color: #c0392b; }
        .empty { color: #888; margin-top: 24px; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
    <p><a th:href="@{/admin/vendors}">← 승인 대기 목록</a></p>
    <h1>전체 업체 목록</h1>
    <form th:action="@{/admin/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">로그아웃</button>
    </form>

    <p th:if="${#lists.isEmpty(vendors)}" class="empty">등록된 업체가 없습니다.</p>

    <table th:unless="${#lists.isEmpty(vendors)}">
        <thead>
            <tr>
                <th>상호명</th>
                <th>사업자등록번호</th>
                <th>대표자명</th>
                <th>연락처</th>
                <th>이메일</th>
                <th>가입 신청일</th>
                <th>승인일</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="vendor : ${vendors}">
                <td th:text="${vendor.businessName}"></td>
                <td th:text="${vendor.businessRegNo}"></td>
                <td th:text="${vendor.ceoName}"></td>
                <td th:text="${vendor.phone}"></td>
                <td th:text="${vendor.email}"></td>
                <td th:text="${#temporals.format(vendor.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${vendor.approvedAt != null} ? ${#temporals.format(vendor.approvedAt, 'yyyy-MM-dd HH:mm')} : '-'"></td>
                <td>
                    <span th:class="'status status-' + ${vendor.status}"
                          th:text="${vendor.status == 'PENDING'} ? '대기중' : (${vendor.status == 'APPROVED'} ? '승인됨' : '거부됨')"></span>
                </td>
            </tr>
        </tbody>
    </table>
    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
