<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>업체 가입 승인 대기 목록 - 한강활동</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --success: #1e8449;
            --success-soft: #e9f7ef;
            --error: #c0392b;
            --error-soft: #fbeceb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 64px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 1040px; margin: 0 auto; }

        .topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 20px; flex-wrap: wrap; gap: 12px; }
        .brand-row { display: flex; align-items: center; gap: 10px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }
        .role-tag { font-size: 10.5px; font-weight: 700; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; text-transform: uppercase; letter-spacing: 0.04em; }

        .admin-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .admin-nav a {
            font-size: 13px; font-weight: 600; color: var(--text-muted);
            padding: 7px 12px; border-radius: 8px;
        }
        .admin-nav a:hover { background: var(--ground); color: var(--text); }
        .admin-nav a.active { background: var(--accent-soft); color: var(--accent); }
        .logout-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); margin-left: 4px; }
        .logout-btn:hover { border-color: var(--text-muted); }

        .page-head { margin: 8px 0 18px; }
        .page-head h1 { margin: 0 0 4px; font-size: 21px; }
        .page-head p { margin: 0; font-size: 13.5px; color: var(--text-muted); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; font-size: 13.5px; }
        thead th { background: var(--ground); color: var(--text-muted); font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--border); }
        tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
        tbody tr:hover { background: var(--ground); }

        .btn { border: none; border-radius: 7px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer; margin-right: 6px; }
        .btn-approve { background: var(--accent); color: #fff; }
        .btn-approve:hover { filter: brightness(1.06); }
        .btn-reject { background: var(--surface); color: var(--error); border: 1px solid var(--error-soft); }
        .btn-reject:hover { background: var(--error-soft); }
        form.inline { display: inline; }

        .empty-state { background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand-row">
            <div class="brand">한강<span>활동</span></div>
            <span class="role-tag">Admin</span>
        </div>
        <div class="admin-nav">
            <a class="active" th:href="@{/admin/vendors}">승인 대기</a>
            <a th:href="@{/admin/vendors/all}">전체 업체</a>
            <a th:href="@{/admin/notices}">공지사항</a>
            <a th:href="@{/admin/events}">이벤트</a>
            <form th:action="@{/admin/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout-btn">로그아웃</button>
            </form>
        </div>
    </div>

    <div class="page-head">
        <h1>업체 가입 승인 대기 목록</h1>
        <p>새로 가입 신청한 업체를 확인하고 승인 또는 거부하세요.</p>
    </div>

    <p th:if="${#lists.isEmpty(vendors)}" class="empty-state">승인 대기 중인 업체가 없습니다.</p>

    <div class="card" th:unless="${#lists.isEmpty(vendors)}">
        <table>
            <thead>
                <tr>
                    <th>상호명</th>
                    <th>사업자등록번호</th>
                    <th>대표자명</th>
                    <th>연락처</th>
                    <th>이메일</th>
                    <th>가입 신청일</th>
                    <th>처리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="vendor : ${vendors}">
                    <td th:text="${vendor.businessName}"></td>
                    <td th:text="${vendor.businessRegNo}"></td>
                    <td th:text="${vendor.ceoName}"></td>
                    <td th:text="${vendor.phone}"></td>
                    <td th:text="${vendor.email}"></td>
                    <td th:text="${#temporals.format(vendor.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <form class="inline" th:action="@{/admin/vendors/{id}/approve(id=${vendor.vendorId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-approve">승인</button>
                        </form>
                        <form class="inline" th:action="@{/admin/vendors/{id}/reject(id=${vendor.vendorId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-reject">거부</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer>한강활동</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
