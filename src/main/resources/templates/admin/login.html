<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인 - 한강활동</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --error: #c0392b;
            --error-soft: #fbeceb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { width: 100%; max-width: 400px; }

        .brand { text-align: center; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 24px; }
        .brand span { color: var(--accent); }
        .role-tag { display: block; text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px clamp(20px, 5vw, 34px); }
        h1 { margin: 0 0 4px; font-size: 19px; text-align: center; }
        .sub { margin: 0 0 22px; font-size: 13px; color: var(--text-muted); text-align: center; }

        .banner { border-radius: 10px; padding: 11px 14px; font-size: 13px; margin-bottom: 18px; }
        .banner.error { background: var(--error-soft); color: var(--error); }
        .banner.notice { background: var(--accent-soft); color: var(--accent); }

        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
        .field input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--text);
            background: var(--ground);
        }
        .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

        .submit-btn {
            width: 100%;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 0;
            cursor: pointer;
        }
        .submit-btn:hover { filter: brightness(1.06); }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">
    <div class="brand">한강<span>활동</span></div>
    <span class="role-tag">Admin</span>

    <div class="card" style="margin-top:16px;">
        <h1>관리자 로그인</h1>
        <p class="sub">업체 가입 승인 및 콘텐츠 관리</p>

        <p th:if="${param.error}" class="banner error">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <p th:if="${param.logout}" class="banner notice">로그아웃되었습니다.</p>

        <form th:action="@{/admin/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="field">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username">
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password">
            </div>
            <button type="submit" class="submit-btn">로그인</button>
        </form>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
