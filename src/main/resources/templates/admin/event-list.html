<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이벤트 관리 - 한강활동</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 64px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 1080px; margin: 0 auto; }

        .topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 20px; flex-wrap: wrap; gap: 12px; }
        .brand-row { display: flex; align-items: center; gap: 10px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }
        .role-tag { font-size: 10.5px; font-weight: 700; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; text-transform: uppercase; letter-spacing: 0.04em; }

        .admin-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .admin-nav a { font-size: 13px; font-weight: 600; color: var(--text-muted); padding: 7px 12px; border-radius: 8px; }
        .admin-nav a:hover { background: var(--ground); color: var(--text); }
        .admin-nav a.active { background: var(--accent-soft); color: var(--accent); }
        .logout-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); margin-left: 4px; }
        .logout-btn:hover { border-color: var(--text-muted); }

        .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 8px 0 18px; flex-wrap: wrap; gap: 12px; }
        .page-head h1 { margin: 0 0 4px; font-size: 21px; }
        .page-head p { margin: 0; font-size: 13.5px; color: var(--text-muted); }
        .btn-new { border: none; border-radius: 9px; background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 700; padding: 9px 16px; cursor: pointer; }
        .btn-new:hover { filter: brightness(1.06); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; font-size: 13.5px; white-space: nowrap; }
        thead th { background: var(--ground); color: var(--text-muted); font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--border); }
        tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
        tbody tr:hover { background: var(--ground); }
        tbody tr.hidden-row td { color: var(--text-muted); }

        .pin-tag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
        .status-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
        .status-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #8fce9e; }
        tr.hidden-row .status-dot::before { background: #c3c9d1; }

        form.inline { display: inline; }
        .btn { border: none; border-radius: 7px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; margin-right: 6px; }
        .btn-edit { background: var(--ground); color: var(--text); border: 1px solid var(--border); }
        .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
        .btn-toggle { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-toggle:hover { border-color: var(--text-muted); }

        .empty-state { background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand-row">
            <div class="brand">한강<span>활동</span></div>
            <span class="role-tag">Admin</span>
        </div>
        <div class="admin-nav">
            <a th:href="@{/admin/vendors}">승인 대기</a>
            <a th:href="@{/admin/vendors/all}">전체 업체</a>
            <a th:href="@{/admin/notices}">공지사항</a>
            <a class="active" th:href="@{/admin/events}">이벤트</a>
            <form th:action="@{/admin/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout-btn">로그아웃</button>
            </form>
        </div>
    </div>

    <div class="page-head">
        <div>
            <h1>이벤트 관리</h1>
            <p>홈 화면에 노출되는 이벤트를 작성하고 관리합니다.</p>
        </div>
        <a class="btn-new" th:href="@{/admin/events/new}">+ 새 이벤트</a>
    </div>

    <p th:if="${#lists.isEmpty(events)}" class="empty-state">등록된 이벤트가 없습니다.</p>

    <div class="card" th:unless="${#lists.isEmpty(events)}">
        <table>
            <thead>
                <tr>
                    <th>제목</th>
                    <th>이벤트 날짜</th>
                    <th>장소</th>
                    <th>게시일</th>
                    <th>고정</th>
                    <th>상태</th>
                    <th>처리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="event : ${events}" th:classappend="${event.hidden} ? 'hidden-row' : ''">
                    <td th:text="${event.title}"></td>
                    <td th:text="${event.eventDate}"></td>
                    <td th:text="${event.location}"></td>
                    <td th:text="${event.publishDate}"></td>
                    <td><span th:if="${event.pinned}" class="pin-tag">고정</span></td>
                    <td><span class="status-dot" th:text="${event.hidden} ? '숨김' : '노출'"></span></td>
                    <td>
                        <a class="btn btn-edit" th:href="@{/admin/events/{id}/edit(id=${event.eventId})}">수정</a>
                        <form class="inline" th:if="${!event.hidden}" th:action="@{/admin/events/{id}/hide(id=${event.eventId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-toggle">숨기기</button>
                        </form>
                        <form class="inline" th:if="${event.hidden}" th:action="@{/admin/events/{id}/show(id=${event.eventId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-toggle">노출</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer>한강활동</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
