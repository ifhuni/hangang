<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이벤트 관리 - 한강웹</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; font-size: 14px; }
        th { background: #f5f5f5; }
        .new { display: inline-block; padding: 8px 16px; background: #2980b9; color: white; text-decoration: none; }
        .empty { color: #888; margin-top: 24px; }
        .pin { color: #2980b9; font-weight: bold; }
        .hidden-row { color: #aaa; }
        form.inline { display: inline; }
        button { padding: 5px 10px; cursor: pointer; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
    <p><a th:href="@{/admin/vendors}">← 관리자 홈</a> · <a th:href="@{/admin/notices}">공지사항 관리</a></p>
    <h1>이벤트 관리</h1>
    <a class="new" th:href="@{/admin/events/new}">+ 새 이벤트</a>

    <p th:if="${#lists.isEmpty(events)}" class="empty">등록된 이벤트가 없습니다.</p>

    <table th:unless="${#lists.isEmpty(events)}">
        <thead>
            <tr>
                <th>제목</th>
                <th>이벤트 날짜</th>
                <th>장소</th>
                <th>게시일</th>
                <th>고정</th>
                <th>상태</th>
                <th>처리</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="event : ${events}" th:classappend="${event.hidden} ? 'hidden-row' : ''">
                <td th:text="${event.title}"></td>
                <td th:text="${event.eventDate}"></td>
                <td th:text="${event.location}"></td>
                <td th:text="${event.publishDate}"></td>
                <td th:text="${event.pinned} ? '고정' : ''" class="pin"></td>
                <td th:text="${event.hidden} ? '숨김' : '노출'"></td>
                <td>
                    <a th:href="@{/admin/events/{id}/edit(id=${event.eventId})}">수정</a>
                    <form class="inline" th:if="${!event.hidden}" th:action="@{/admin/events/{id}/hide(id=${event.eventId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit">숨기기</button>
                    </form>
                    <form class="inline" th:if="${event.hidden}" th:action="@{/admin/events/{id}/show(id=${event.eventId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit">노출</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
