<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${eventId} ? '이벤트 수정 - 한강웹' : '이벤트 등록 - 한강웹'"></title>
    <style>
        body { font-family: sans-serif; max-width: 560px; margin: 60px auto; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 120px; }
        .row { display: flex; gap: 16px; }
        .row .field { flex: 1; }
        .checkbox { display: flex; align-items: center; gap: 8px; }
        .checkbox input { width: auto; }
        .error { color: #c0392b; font-size: 13px; margin-top: 4px; }
        button { padding: 10px 20px; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
    <h1 th:text="${eventId} ? '이벤트 수정' : '이벤트 등록'"></h1>

    <form th:action="${eventId} ? @{/admin/events/{id}(id=${eventId})} : @{/admin/events}"
          th:object="${eventForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label>제목</label>
            <input type="text" th:field="*{title}">
            <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="field">
            <label>설명</label>
            <textarea th:field="*{description}"></textarea>
        </div>
        <div class="field">
            <label>장소</label>
            <input type="text" th:field="*{location}">
        </div>
        <div class="row">
            <div class="field">
                <label>이벤트 날짜</label>
                <input type="date" th:field="*{eventDate}">
                <div class="error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
            </div>
            <div class="field">
                <label>게시일</label>
                <input type="date" th:field="*{publishDate}">
                <div class="error" th:if="${#fields.hasErrors('publishDate')}" th:errors="*{publishDate}"></div>
            </div>
        </div>
        <div class="field checkbox">
            <input type="checkbox" id="pinned" th:field="*{pinned}">
            <label for="pinned" style="margin:0;">상단 고정</label>
        </div>

        <button type="submit" th:text="${eventId} ? '수정' : '등록'"></button>
    </form>
    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
