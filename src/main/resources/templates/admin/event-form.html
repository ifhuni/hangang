<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${eventId} ? '이벤트 수정 - 한강웹' : '이벤트 등록 - 한강웹'"></title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --error: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 80px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 600px; margin: 0 auto; }

        .topbar { padding-block: 20px; display: flex; align-items: center; gap: 10px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }
        .role-tag { font-size: 10.5px; font-weight: 700; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; text-transform: uppercase; letter-spacing: 0.04em; }

        .back-link { display: inline-block; margin-bottom: 14px; font-size: 13.5px; color: var(--text-muted); }
        .back-link:hover { color: var(--accent); }

        h1 { margin: 0 0 20px; font-size: 21px; }

        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px clamp(18px, 4vw, 30px); }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
        .field input, .field textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--text);
            background: var(--ground);
        }
        .field textarea { height: 110px; resize: vertical; }
        .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .field-error { color: var(--error); font-size: 12.5px; margin-top: 5px; }

        .row { display: flex; gap: 14px; }
        .row .field { flex: 1; }
        @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }

        .checkbox-field { display: flex; align-items: center; gap: 9px; margin-bottom: 16px; }
        .checkbox-field input { width: auto; accent-color: var(--accent); }
        .checkbox-field label { margin: 0; font-size: 13.5px; font-weight: 600; }

        .submit-btn {
            width: 100%;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 0;
            cursor: pointer;
        }
        .submit-btn:hover { filter: brightness(1.06); }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand">한강<span>웹</span></div>
        <span class="role-tag">Admin</span>
    </div>

    <a class="back-link" th:href="@{/admin/events}">← 이벤트 관리</a>

    <h1 th:text="${eventId} ? '이벤트 수정' : '이벤트 등록'"></h1>

    <div class="form-card">
        <form th:action="${eventId} ? @{/admin/events/{id}(id=${eventId})} : @{/admin/events}"
              th:object="${eventForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="title">제목</label>
                <input type="text" id="title" th:field="*{title}">
                <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="field">
                <label for="description">설명</label>
                <textarea id="description" th:field="*{description}"></textarea>
            </div>
            <div class="field">
                <label for="location">장소</label>
                <input type="text" id="location" th:field="*{location}" placeholder="예: 뚝섬한강공원">
            </div>
            <div class="row">
                <div class="field">
                    <label for="eventDate">이벤트 날짜</label>
                    <input type="date" id="eventDate" th:field="*{eventDate}">
                    <div class="field-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
                </div>
                <div class="field">
                    <label for="publishDate">게시일</label>
                    <input type="date" id="publishDate" th:field="*{publishDate}">
                    <div class="field-error" th:if="${#fields.hasErrors('publishDate')}" th:errors="*{publishDate}"></div>
                </div>
            </div>
            <div class="checkbox-field">
                <input type="checkbox" id="pinned" th:field="*{pinned}">
                <label for="pinned">상단 고정</label>
            </div>

            <button type="submit" class="submit-btn" th:text="${eventId} ? '수정하기' : '등록하기'"></button>
        </form>
    </div>

    <footer>한강웹</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
