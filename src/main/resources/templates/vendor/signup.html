<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>업체 회원가입 - 한강웹</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --error: #c0392b;
            --error-soft: #fbeceb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { width: 100%; max-width: 440px; }

        .brand { text-align: center; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 24px; }
        .brand span { color: var(--accent); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px clamp(20px, 5vw, 34px); }
        h1 { margin: 0 0 4px; font-size: 19px; text-align: center; }
        .sub { margin: 0 0 22px; font-size: 13px; color: var(--text-muted); text-align: center; }

        .banner { background: var(--error-soft); color: var(--error); border-radius: 10px; padding: 11px 14px; font-size: 13px; margin-bottom: 18px; }

        .field { margin-bottom: 16px; }
        .field:last-of-type { margin-bottom: 0; }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
        .field input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--text);
            background: var(--ground);
        }
        .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .field-error { color: var(--error); font-size: 12.5px; margin-top: 5px; }

        .submit-btn {
            width: 100%;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 0;
            cursor: pointer;
        }
        .submit-btn:hover { filter: brightness(1.06); }

        .login-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
        .login-link a { color: var(--accent); font-weight: 700; }
        .login-link a:hover { text-decoration: underline; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">
    <div class="brand">한강<span>웹</span></div>

    <div class="card">
        <h1>업체 회원가입</h1>
        <p class="sub">가입 신청 후 관리자 승인이 완료되면 이용하실 수 있습니다.</p>

        <p th:if="${errorMessage}" class="banner" th:text="${errorMessage}"></p>

        <form th:action="@{/vendor/signup}" th:object="${vendorSignupForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="businessName">상호명</label>
                <input type="text" id="businessName" th:field="*{businessName}">
                <div class="field-error" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></div>
            </div>
            <div class="field">
                <label for="businessRegNo">사업자등록번호</label>
                <input type="text" id="businessRegNo" th:field="*{businessRegNo}" placeholder="000-00-00000">
                <div class="field-error" th:if="${#fields.hasErrors('businessRegNo')}" th:errors="*{businessRegNo}"></div>
            </div>
            <div class="field">
                <label for="ceoName">대표자명</label>
                <input type="text" id="ceoName" th:field="*{ceoName}">
                <div class="field-error" th:if="${#fields.hasErrors('ceoName')}" th:errors="*{ceoName}"></div>
            </div>
            <div class="field">
                <label for="phone">연락처</label>
                <input type="text" id="phone" th:field="*{phone}" placeholder="010-0000-0000">
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" id="email" th:field="*{email}" placeholder="example@email.com">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}">
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="submit-btn">가입 신청</button>
        </form>

        <p class="login-link">이미 계정이 있으신가요? <a th:href="@{/vendor/login}">로그인</a></p>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
