<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>업체 정보 관리 - 한강활동</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --success: #1e8449;
            --success-soft: #e9f7ef;
            --error: #c0392b;
            --error-soft: #fbeceb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 80px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 560px; margin: 0 auto; }

        .topbar { padding-block: 20px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }

        .back-link { display: inline-block; margin-bottom: 14px; font-size: 13.5px; color: var(--text-muted); }
        .back-link:hover { color: var(--accent); }

        h1 { margin: 0 0 20px; font-size: 21px; }

        .banner { border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; }
        .banner.success { background: var(--success-soft); color: var(--success); }
        .banner.error { background: var(--error-soft); color: var(--error); }

        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px clamp(18px, 4vw, 30px); }
        .form-section + .form-section { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--border); }
        .form-section h2 { margin: 0 0 4px; font-size: 14px; }
        .form-section .section-sub { margin: 0 0 16px; font-size: 12.5px; color: var(--text-muted); }

        .field { margin-bottom: 16px; }
        .field:last-child { margin-bottom: 0; }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--text); }
        .field input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--text);
            background: var(--ground);
        }
        .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .field-error { color: var(--error); font-size: 12.5px; margin-top: 5px; }
        .field-hint { color: var(--text-muted); font-size: 12px; margin-top: 5px; }

        .submit-btn {
            width: 100%;
            margin-top: 24px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 15.5px;
            font-weight: 700;
            padding: 13px 0;
            cursor: pointer;
        }
        .submit-btn:hover { filter: brightness(1.06); }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand">한강<span>활동</span></div>
    </div>

    <a class="back-link" th:href="@{/vendor/dashboard}">← 대시보드</a>

    <h1>업체 정보 관리</h1>

    <p th:if="${successMessage}" class="banner success" th:text="${successMessage}"></p>
    <p th:if="${errorMessage}" class="banner error" th:text="${errorMessage}"></p>

    <div class="form-card">
        <form th:action="@{/vendor/profile}" th:object="${vendorProfileForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-section">
                <h2>사업자 정보</h2>
                <p class="section-sub">언제든 자유롭게 수정할 수 있으며, 별도 재승인 절차는 없습니다.</p>

                <div class="field">
                    <label for="businessName">상호명</label>
                    <input type="text" id="businessName" th:field="*{businessName}">
                    <div class="field-error" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></div>
                </div>
                <div class="field">
                    <label for="businessRegNo">사업자등록번호</label>
                    <input type="text" id="businessRegNo" th:field="*{businessRegNo}">
                    <div class="field-error" th:if="${#fields.hasErrors('businessRegNo')}" th:errors="*{businessRegNo}"></div>
                </div>
                <div class="field">
                    <label for="ceoName">대표자명</label>
                    <input type="text" id="ceoName" th:field="*{ceoName}">
                    <div class="field-error" th:if="${#fields.hasErrors('ceoName')}" th:errors="*{ceoName}"></div>
                </div>
                <div class="field">
                    <label for="phone">연락처</label>
                    <input type="text" id="phone" th:field="*{phone}">
                    <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
            </div>

            <div class="form-section">
                <h2>계정 정보</h2>
                <p class="section-sub">이메일은 로그인 시 아이디로 사용됩니다.</p>

                <div class="field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" th:field="*{email}">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="field">
                    <label for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}">
                    <div class="field-hint">변경하지 않으려면 비워두세요.</div>
                </div>
            </div>

            <button type="submit" class="submit-btn">저장</button>
        </form>
    </div>

    <footer>한강활동</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
