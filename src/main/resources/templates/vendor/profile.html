<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>업체 정보 관리 - 한강웹</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .hint { color: #888; font-size: 12px; margin-top: 4px; }
        .error { color: #c0392b; font-size: 13px; margin-top: 4px; }
        .success { color: #1e8449; font-size: 13px; margin-bottom: 16px; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>
    <p><a th:href="@{/vendor/dashboard}">← 대시보드</a></p>
    <h1>업체 정보 관리</h1>

    <p th:if="${successMessage}" class="success" th:text="${successMessage}"></p>
    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <form th:action="@{/vendor/profile}" th:object="${vendorProfileForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label>상호명</label>
            <input type="text" th:field="*{businessName}">
            <div class="error" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></div>
        </div>
        <div class="field">
            <label>사업자등록번호</label>
            <input type="text" th:field="*{businessRegNo}">
            <div class="error" th:if="${#fields.hasErrors('businessRegNo')}" th:errors="*{businessRegNo}"></div>
        </div>
        <div class="field">
            <label>대표자명</label>
            <input type="text" th:field="*{ceoName}">
            <div class="error" th:if="${#fields.hasErrors('ceoName')}" th:errors="*{ceoName}"></div>
        </div>
        <div class="field">
            <label>연락처</label>
            <input type="text" th:field="*{phone}">
            <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="field">
            <label>이메일</label>
            <input type="email" th:field="*{email}">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="field">
            <label>새 비밀번호</label>
            <input type="password" th:field="*{newPassword}">
            <div class="hint">변경하지 않으려면 비워두세요.</div>
        </div>

        <button type="submit">저장</button>
    </form>
</body>
</html>
