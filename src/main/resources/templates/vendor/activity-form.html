<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${activityId} ? '활동 수정 - 한강활동' : '활동 등록 - 한강활동'"></title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --error: #c0392b;
            --error-soft: #fbeceb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 80px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 620px; margin: 0 auto; }

        .topbar { padding-block: 20px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }

        .back-link { display: inline-block; margin-bottom: 14px; font-size: 13.5px; color: var(--text-muted); }
        .back-link:hover { color: var(--accent); }

        h1 { margin: 0 0 6px; font-size: 21px; }
        .sub { margin: 0 0 20px; font-size: 13px; color: var(--text-muted); }

        .banner { background: var(--error-soft); color: var(--error); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; }

        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px clamp(18px, 4vw, 30px); }
        .form-section + .form-section { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--border); }
        .form-section h2 { margin: 0 0 16px; font-size: 14px; }

        .field { margin-bottom: 16px; }
        .field:last-child { margin-bottom: 0; }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--text); }
        .field input, .field textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--text);
            background: var(--ground);
        }
        .field textarea { height: 96px; resize: vertical; }
        .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .field-error { color: var(--error); font-size: 12.5px; margin-top: 5px; }
        .field-hint { color: var(--text-muted); font-size: 12px; margin-top: 5px; }

        .image-preview { display: block; max-width: 220px; max-height: 160px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; object-fit: cover; }
        .field input[type="file"] { border: 1px dashed var(--border); background: var(--surface); padding: 10px 12px; cursor: pointer; }

        .content-block-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
        .content-block { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--ground); }
        .content-block:has(.remove-checkbox:checked) { opacity: .45; }
        .content-block .block-body textarea { min-height: 70px; margin-bottom: 0; }
        .block-type-tag { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
        .block-thumb { max-width: 200px; max-height: 140px; border-radius: 8px; object-fit: cover; display: block; margin-bottom: 8px; }
        .block-controls { display: flex; justify-content: flex-end; margin-top: 8px; }
        .remove-toggle { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--error); cursor: pointer; }
        .block-actions { display: flex; gap: 10px; }
        .block-actions button {
            flex: 1; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--accent);
            border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .block-actions button:hover { filter: brightness(1.05); }

        .row { display: flex; gap: 14px; }
        .row .field { flex: 1; }
        @media (max-width: 480px) { .row { flex-direction: column; gap: 0; } }

        .submit-btn {
            width: 100%;
            margin-top: 24px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 15.5px;
            font-weight: 700;
            padding: 13px 0;
            cursor: pointer;
        }
        .submit-btn:hover { filter: brightness(1.06); }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand">한강<span>활동</span></div>
    </div>

    <a class="back-link" th:href="@{/vendor/dashboard}">← 대시보드</a>

    <h1 th:text="${activityId} ? '활동 수정' : '활동 등록'"></h1>
    <p class="sub" th:text="${activityId} ? '수정 내용은 저장 즉시 반영됩니다.' : '등록하면 관리자 검수 없이 바로 노출됩니다.'"></p>

    <p th:if="${errorMessage}" class="banner" th:text="${errorMessage}"></p>

    <div class="form-card">
        <form th:action="${activityId} ? @{/vendor/activities/{id}(id=${activityId})} : @{/vendor/activities}"
              th:object="${activityForm}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-section">
                <h2>기본 정보</h2>

                <div class="field">
                    <label for="title">제목</label>
                    <input type="text" id="title" th:field="*{title}" placeholder="예: 한강 카약 밥투리">
                    <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                <div class="field">
                    <label>활동 소개</label>
                    <div class="field-hint" style="margin-top:0; margin-bottom:10px;">텍스트와 사진을 원하는 순서로 추가해 활동을 소개하세요.</div>

                    <div id="content-block-list" class="content-block-list">
                        <div class="content-block" th:each="block, iterStat : *{contentBlocks}">
                            <div class="block-type-tag" th:text="${block.type == 'TEXT'} ? '텍스트' : '이미지'"></div>
                            <input type="hidden" th:field="*{contentBlocks[__${iterStat.index}__].type}">
                            <input type="hidden" th:if="${block.existingImagePath != null}"
                                   th:field="*{contentBlocks[__${iterStat.index}__].existingImagePath}">
                            <div class="block-body">
                                <textarea th:if="${block.type == 'TEXT'}"
                                          th:field="*{contentBlocks[__${iterStat.index}__].text}"
                                          placeholder="텍스트를 입력하세요"></textarea>
                                <th:block th:if="${block.type == 'IMAGE'}">
                                    <img th:if="${block.existingImagePath != null}" th:src="@{${block.existingImagePath}}"
                                         class="block-thumb" alt="">
                                    <input type="file" th:field="*{contentBlocks[__${iterStat.index}__].image}" accept="image/*">
                                    <div class="field-hint" th:if="${block.existingImagePath != null}">새 파일을 선택하면 이 사진이 교체됩니다.</div>
                                </th:block>
                            </div>
                            <div class="block-controls">
                                <label class="remove-toggle">
                                    <input type="checkbox" class="remove-checkbox"
                                           th:field="*{contentBlocks[__${iterStat.index}__].removed}">
                                    <span>이 블록 삭제</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="block-actions">
                        <button type="button" id="add-text-block">+ 텍스트 추가</button>
                        <button type="button" id="add-image-block">+ 사진 추가</button>
                    </div>
                </div>
                <div class="field">
                    <label for="location">장소</label>
                    <input type="text" id="location" th:field="*{location}" placeholder="예: 뚝섬한강공원">
                    <div class="field-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                </div>
                <div class="field">
                    <label for="image">대표 사진 (목록/상세 상단에 표시)</label>
                    <img th:if="${currentImagePath != null}" th:src="@{${currentImagePath}}" class="image-preview" alt="현재 등록된 사진">
                    <input type="file" id="image" th:field="*{image}" accept="image/*">
                    <div class="field-hint" th:text="${currentImagePath != null} ? '새 파일을 선택하면 기존 사진이 교체됩니다.' : '활동 목록 카드와 상세 페이지 상단에 노출될 사진입니다. (선택, 5MB 이하)'"></div>
                </div>
                <div class="field">
                    <label for="price">금액(원)</label>
                    <input type="number" id="price" th:field="*{price}" placeholder="0">
                    <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
            </div>

            <div class="form-section">
                <h2>등록 기간 <span style="font-weight:400; color:var(--text-muted);">— 참여 신청을 받는 기간</span></h2>
                <div class="row">
                    <div class="field">
                        <label for="registrationStartDate">시작일</label>
                        <input type="date" id="registrationStartDate" th:field="*{registrationStartDate}">
                        <div class="field-error" th:if="${#fields.hasErrors('registrationStartDate')}" th:errors="*{registrationStartDate}"></div>
                    </div>
                    <div class="field">
                        <label for="registrationEndDate">종료일</label>
                        <input type="date" id="registrationEndDate" th:field="*{registrationEndDate}">
                        <div class="field-error" th:if="${#fields.hasErrors('registrationEndDate')}" th:errors="*{registrationEndDate}"></div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>활동 기간 <span style="font-weight:400; color:var(--text-muted);">— 참여자가 실제로 참여하는 기간</span></h2>
                <div class="row">
                    <div class="field">
                        <label for="activityStartDate">시작일</label>
                        <input type="date" id="activityStartDate" th:field="*{activityStartDate}">
                        <div class="field-error" th:if="${#fields.hasErrors('activityStartDate')}" th:errors="*{activityStartDate}"></div>
                    </div>
                    <div class="field">
                        <label for="activityEndDate">종료일</label>
                        <input type="date" id="activityEndDate" th:field="*{activityEndDate}">
                        <div class="field-error" th:if="${#fields.hasErrors('activityEndDate')}" th:errors="*{activityEndDate}"></div>
                    </div>
                </div>
                <div class="field">
                    <label for="dailyCapacity">하루당 정원(명)</label>
                    <input type="number" id="dailyCapacity" th:field="*{dailyCapacity}" placeholder="0">
                    <div class="field-error" th:if="${#fields.hasErrors('dailyCapacity')}" th:errors="*{dailyCapacity}"></div>
                    <div class="field-hint">활동 기간 중 모든 날짜에 동일하게 적용됩니다.</div>
                </div>
            </div>

            <button type="submit" class="submit-btn" th:text="${activityId} ? '수정하기' : '등록하기'"></button>
        </form>
    </div>

    <footer>한강활동</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
<script>
(function () {
    var list = document.getElementById('content-block-list');
    var nextIndex = list.children.length;

    function addBlock(type) {
        var idx = nextIndex++;
        var div = document.createElement('div');
        div.className = 'content-block';

        var bodyHtml = type === 'TEXT'
            ? '<textarea name="contentBlocks[' + idx + '].text" placeholder="텍스트를 입력하세요"></textarea>'
            : '<input type="file" name="contentBlocks[' + idx + '].image" accept="image/*">';

        div.innerHTML =
            '<div class="block-type-tag">' + (type === 'TEXT' ? '텍스트' : '이미지') + '</div>' +
            '<input type="hidden" name="contentBlocks[' + idx + '].type" value="' + type + '">' +
            '<div class="block-body">' + bodyHtml + '</div>' +
            '<div class="block-controls">' +
                '<label class="remove-toggle">' +
                    '<input type="checkbox" class="remove-checkbox" name="contentBlocks[' + idx + '].removed">' +
                    '<span>이 블록 삭제</span>' +
                '</label>' +
            '</div>';

        list.appendChild(div);
    }

    document.getElementById('add-text-block').addEventListener('click', function () { addBlock('TEXT'); });
    document.getElementById('add-image-block').addEventListener('click', function () { addBlock('IMAGE'); });
})();
</script>
</body>
</html>
