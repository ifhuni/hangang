<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${activityId} ? '활동 수정 - 한강웹' : '활동 등록 - 한강웹'"></title>
    <style>
        body { font-family: sans-serif; max-width: 560px; margin: 60px auto; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 100px; }
        .error { color: #c0392b; font-size: 13px; margin-top: 4px; }
        .row { display: flex; gap: 16px; }
        .row .field { flex: 1; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>
    <h1 th:text="${activityId} ? '활동 수정' : '활동 등록'"></h1>

    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <form th:action="${activityId} ? @{/vendor/activities/{id}(id=${activityId})} : @{/vendor/activities}"
          th:object="${activityForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label>제목</label>
            <input type="text" th:field="*{title}">
            <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="field">
            <label>설명</label>
            <textarea th:field="*{description}"></textarea>
        </div>
        <div class="field">
            <label>금액(원)</label>
            <input type="number" th:field="*{price}">
            <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <div class="row">
            <div class="field">
                <label>등록 시작일</label>
                <input type="date" th:field="*{registrationStartDate}">
                <div class="error" th:if="${#fields.hasErrors('registrationStartDate')}" th:errors="*{registrationStartDate}"></div>
            </div>
            <div class="field">
                <label>등록 종료일</label>
                <input type="date" th:field="*{registrationEndDate}">
                <div class="error" th:if="${#fields.hasErrors('registrationEndDate')}" th:errors="*{registrationEndDate}"></div>
            </div>
        </div>
        <div class="row">
            <div class="field">
                <label>활동 시작일</label>
                <input type="date" th:field="*{activityStartDate}">
                <div class="error" th:if="${#fields.hasErrors('activityStartDate')}" th:errors="*{activityStartDate}"></div>
            </div>
            <div class="field">
                <label>활동 종료일</label>
                <input type="date" th:field="*{activityEndDate}">
                <div class="error" th:if="${#fields.hasErrors('activityEndDate')}" th:errors="*{activityEndDate}"></div>
            </div>
        </div>
        <div class="field">
            <label>하루당 정원(명)</label>
            <input type="number" th:field="*{dailyCapacity}">
            <div class="error" th:if="${#fields.hasErrors('dailyCapacity')}" th:errors="*{dailyCapacity}"></div>
        </div>

        <button type="submit" th:text="${activityId} ? '수정' : '등록'"></button>
    </form>
</body>
</html>
