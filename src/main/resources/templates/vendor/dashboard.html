<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>업체 대시보드 - 한강웹</title>
</head>
<body>
    <h1 th:text="${vendor.businessName} + '님, 환영합니다'"></h1>

    </form>
</body>
</html>
