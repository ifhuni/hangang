<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>업체 대시보드 - 한강웹</title>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
    <h1 th:text="${vendor.businessName} + '님, 환영합니다'"></h1>
    <p><a th:href="@{/vendor/activities}">내 활동 관리</a></p>
    <p><a th:href="@{/vendor/profile}">업체 정보 관리</a></p>
    <form th:action="@{/vendor/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">로그아웃</button>
    </form>
    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
