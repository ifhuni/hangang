<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${activity.title} + ' 참여자 관리 - 한강활동'"></title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        a { color: inherit; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; font-size: 14px; }
        th { background: #f5f5f5; }
        .full { color: #c0392b; font-weight: bold; }
        .status { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .status-PENDING { background: #f1c40f33; color: #b7950b; }
        .status-APPROVED { background: #2ecc7133; color: #1e8449; }
        .approve-btn { padding: 5px 12px; background: #2980b9; color: white; border: none; cursor: pointer; }
        .error { color: #c0392b; font-size: 13px; margin: 12px 0; }
        .empty { color: #888; margin-top: 24px; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
    <p><a th:href="@{/vendor/activities}">← 내 활동 관리</a></p>
    <h1 th:text="${activity.title} + ' 참여자 관리'"></h1>

    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <h2>날짜별 현황</h2>
    <table>
        <thead>
            <tr><th>날짜</th><th>정원</th><th>승인 인원</th><th>대기 인원</th></tr>
        </thead>
        <tbody>
            <tr th:each="summary : ${summaries}">
                <td th:text="${summary.date}"></td>
                <td th:text="${summary.capacity} + '명'"></td>
                <td th:text="${summary.approvedCount} + '명'"
                    th:class="${summary.approvedCount >= summary.capacity} ? 'full' : ''"></td>
                <td th:text="${summary.pendingCount} + '명'"></td>
            </tr>
        </tbody>
    </table>

    <h2>신청자 목록</h2>
    <p th:if="${#lists.isEmpty(applications)}" class="empty">신청자가 없습니다.</p>

    <table th:unless="${#lists.isEmpty(applications)}">
        <thead>
            <tr>
                <th>날짜</th><th>이름</th><th>연락처</th><th>이메일</th><th>성별</th><th>신청일</th><th>상태</th><th>처리</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="app : ${applications}">
                <td th:text="${app.participationDate}"></td>
                <td th:text="${app.applicantName}"></td>
                <td th:text="${app.phone}"></td>
                <td th:text="${app.email}"></td>
                <td th:text="${app.gender == 'M'} ? '남성' : '여성'"></td>
                <td th:text="${#temporals.format(app.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <span th:class="'status status-' + ${app.status}"
                          th:text="${app.status == 'PENDING'} ? '대기중' : '승인됨'"></span>
                </td>
                <td>
                    <form th:if="${app.status == 'PENDING'}"
                          th:action="@{/vendor/activities/{activityId}/participants/{applicationId}/approve(activityId=${activity.activityId}, applicationId=${app.applicationId})}"
                          method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="approve-btn">승인</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
