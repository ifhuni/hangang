<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${activity.title} + ' 참여자 관리 - 한강활동'"></title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --success: #1e8449;
            --success-soft: #e9f7ef;
            --pending: #b7950b;
            --pending-soft: #fbf3d9;
            --error: #c0392b;
            --error-soft: #fdecea;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 64px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 1040px; margin: 0 auto; }

        .topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 20px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }
        .topnav { display: flex; align-items: center; gap: 16px; font-size: 13.5px; color: var(--text-muted); }
        .topnav a:hover { color: var(--text); }

        .back-link { display: inline-block; margin-bottom: 14px; font-size: 13.5px; color: var(--text-muted); }
        .back-link:hover { color: var(--accent); }

        .page-head { margin-bottom: 20px; }
        .page-head h1 { margin: 0 0 4px; font-size: 21px; }
        .page-head p { margin: 0; font-size: 13.5px; color: var(--text-muted); }

        .error-banner {
            background: var(--error-soft); color: var(--error); border-radius: 10px;
            padding: 12px 16px; font-size: 13.5px; font-weight: 600; margin-bottom: 20px;
        }

        .section { margin-top: 32px; }
        .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
        .section-head h2 { margin: 0; font-size: 16.5px; }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .summary-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 14px 16px;
        }
        .summary-card.full { border-color: var(--error); background: var(--error-soft); }
        .summary-card .s-date { font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .summary-card .s-count { font-size: 17px; font-weight: 800; }
        .summary-card .s-count small { font-size: 12px; font-weight: 500; color: var(--text-muted); }
        .summary-card.full .s-count { color: var(--error); }
        .summary-card .s-pending { margin-top: 6px; font-size: 12px; color: var(--pending); font-weight: 600; }

        table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        thead th {
            background: var(--ground); text-align: left; font-size: 11.5px; font-weight: 700;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em;
            padding: 12px 14px; border-bottom: 1px solid var(--border);
        }
        tbody td { padding: 12px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--ground); }

        .status-tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
        .status-tag.PENDING { background: var(--pending-soft); color: var(--pending); }
        .status-tag.APPROVED { background: var(--success-soft); color: var(--success); }

        .approve-btn {
            border: none; border-radius: 8px; background: var(--accent); color: #fff;
            font-size: 12.5px; font-weight: 700; padding: 7px 14px; cursor: pointer;
        }
        .approve-btn:hover { filter: brightness(1.06); }

        .empty-state { background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13.5px; }

        footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand">한강<span>활동</span></div>
    </div>

    <a class="back-link" th:href="@{/vendor/dashboard}">← 대시보드</a>

    <div class="page-head">
        <h1 th:text="${activity.title} + ' 참여자 관리'"></h1>
        <p>날짜별 신청 현황을 확인하고 대기중인 신청자를 승인하세요.</p>
    </div>

    <p th:if="${errorMessage}" class="error-banner" th:text="${errorMessage}"></p>

    <div class="section">
        <div class="section-head">
            <h2>날짜별 현황</h2>
        </div>
        <div class="summary-grid">
            <div class="summary-card" th:each="summary : ${summaries}"
                 th:classappend="${summary.approvedCount >= summary.capacity} ? 'full' : ''">
                <div class="s-date" th:text="${summary.date}"></div>
                <div class="s-count">
                    <span th:text="${summary.approvedCount}"></span><small th:text="'명 / ' + ${summary.capacity} + '명'"></small>
                </div>
                <div class="s-pending" th:if="${summary.pendingCount > 0}" th:text="'대기 ' + ${summary.pendingCount} + '명'"></div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-head">
            <h2>신청자 목록</h2>
        </div>

        <p th:if="${#lists.isEmpty(applications)}" class="empty-state">신청자가 없습니다.</p>

        <table th:unless="${#lists.isEmpty(applications)}">
            <thead>
                <tr>
                    <th>날짜</th><th>이름</th><th>연락처</th><th>이메일</th><th>성별</th><th>신청일</th><th>상태</th><th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="app : ${applications}">
                    <td th:text="${app.participationDate}"></td>
                    <td th:text="${app.applicantName}"></td>
                    <td th:text="${app.phone}"></td>
                    <td th:text="${app.email}"></td>
                    <td th:text="${app.gender == 'M'} ? '남성' : '여성'"></td>
                    <td th:text="${#temporals.format(app.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <span th:class="'status-tag ' + ${app.status}"
                              th:text="${app.status == 'PENDING'} ? '대기중' : '승인됨'"></span>
                    </td>
                    <td>
                        <form th:if="${app.status == 'PENDING'}"
                              th:action="@{/vendor/activities/{activityId}/participants/{applicationId}/approve(activityId=${activity.activityId}, applicationId=${app.applicationId})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="approve-btn">승인</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer>한강활동</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
