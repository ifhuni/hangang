<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 신청 조회 - 한강웹</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --error: #c0392b;
            --error-soft: #fbeceb;
            --pending: #b7950b;
            --pending-soft: #fbf3d9;
            --approved: #1e8449;
            --approved-soft: #e9f7ef;
            --cancelled: #7f8c8d;
            --cancelled-soft: #eceeee;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 80px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 480px; margin: 0 auto; }

        .topbar { padding-block: 20px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }

        h1 { margin: 0 0 16px; font-size: 21px; }

        .error-banner { background: var(--error-soft); color: var(--error); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px clamp(18px, 4vw, 28px); }

        .status {
            display: inline-block; padding: 5px 14px; border-radius: 999px;
            font-size: 13px; font-weight: 700; margin-bottom: 18px;
        }
        .status-PENDING { background: var(--pending-soft); color: var(--pending); }
        .status-APPROVED { background: var(--approved-soft); color: var(--approved); }
        .status-CANCELLED { background: var(--cancelled-soft); color: var(--cancelled); }

        .info-list { display: flex; flex-direction: column; gap: 14px; }
        .info-row { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .info-row:last-child { border-bottom: none; padding-bottom: 0; }
        .info-row .label { font-size: 13px; color: var(--text-muted); flex: none; }
        .info-row .value { font-size: 14px; font-weight: 600; text-align: right; }

        .actions { display: flex; gap: 10px; margin-top: 22px; }
        .btn { flex: 1; display: block; text-align: center; padding: 12px 0; border-radius: 10px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-danger:hover { filter: brightness(1.08); }
        .btn-secondary { background: var(--ground); color: var(--text); border: 1px solid var(--border); }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); text-align: center; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand">한강<span>웹</span></div>
    </div>

    <h1>내 신청 조회</h1>

    <p th:if="${errorMessage}" class="error-banner" th:text="${errorMessage}"></p>

    <div class="card">
        <span th:class="'status status-' + ${myApplication.status}"
              th:text="${myApplication.status == 'PENDING'} ? '대기중' : (${myApplication.status == 'APPROVED'} ? '승인됨' : '취소됨')"></span>

        <div class="info-list">
            <div class="info-row">
                <span class="label">활동명</span>
                <span class="value" th:text="${myApplication.activityTitle}"></span>
            </div>
            <div class="info-row">
                <span class="label">참여 희망 날짜</span>
                <span class="value" th:text="${myApplication.participationDate}"></span>
            </div>
            <div class="info-row">
                <span class="label">이름</span>
                <span class="value" th:text="${myApplication.applicantName}"></span>
            </div>
            <div class="info-row">
                <span class="label">연락처</span>
                <span class="value" th:text="${myApplication.phone}"></span>
            </div>
            <div class="info-row">
                <span class="label">이메일</span>
                <span class="value" th:text="${myApplication.email}"></span>
            </div>
            <div class="info-row">
                <span class="label">신청일</span>
                <span class="value" th:text="${#temporals.format(myApplication.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
        </div>

        <div class="actions">
            <form th:if="${myApplication.status != 'CANCELLED'}" style="flex:1;"
                  th:action="@{/apply/{token}/cancel(token=${myApplication.token})}" method="post"
                  onsubmit="return confirm('신청을 취소하시겠습니까?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger" style="width:100%;">신청 취소</button>
            </form>
            <a class="btn btn-secondary" th:href="@{/activities}">활동 목록으로</a>
        </div>
    </div>

    <footer>한강웹</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
