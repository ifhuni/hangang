<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 신청 조회 - 한강웹</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
        dl { margin-top: 16px; }
        dt { font-weight: bold; margin-top: 8px; }
        dd { margin: 0; }
        .status { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 13px; }
        .status-PENDING { background: #f1c40f33; color: #b7950b; }
        .status-APPROVED { background: #2ecc7133; color: #1e8449; }
        .status-CANCELLED { background: #e74c3c33; color: #c0392b; }
        .error { color: #c0392b; font-size: 13px; margin-top: 4px; }
        .actions { display: flex; gap: 8px; margin-top: 20px; }
        button { padding: 10px 20px; background: #c0392b; color: white; border: none; }
        .list-link { padding: 10px 20px; background: #7f8c8d; color: white; text-decoration: none; display: inline-block; box-sizing: border-box; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
    <h1>내 신청 조회</h1>

    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <span th:class="'status status-' + ${myApplication.status}"
          th:text="${myApplication.status == 'PENDING'} ? '대기중' : (${myApplication.status == 'APPROVED'} ? '승인됨' : '취소됨')"></span>

    <dl>
        <dt>활동명</dt>
        <dd th:text="${myApplication.activityTitle}"></dd>
        <dt>참여 희망 날짜</dt>
        <dd th:text="${myApplication.participationDate}"></dd>
        <dt>이름</dt>
        <dd th:text="${myApplication.applicantName}"></dd>
        <dt>연락처</dt>
        <dd th:text="${myApplication.phone}"></dd>
        <dt>이메일</dt>
        <dd th:text="${myApplication.email}"></dd>
        <dt>신청일</dt>
        <dd th:text="${#temporals.format(myApplication.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>
    </dl>

    <div class="actions">
        <form th:if="${myApplication.status != 'CANCELLED'}" th:action="@{/apply/{token}/cancel(token=${myApplication.token})}" method="post"
              onsubmit="return confirm('신청을 취소하시겠습니까?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">신청 취소</button>
        </form>
        <a class="list-link" th:href="@{/activities}">활동 목록으로</a>
    </div>
    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
