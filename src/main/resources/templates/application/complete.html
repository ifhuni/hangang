<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>신청 완료 - 한강웹</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
        .notice { color: #2980b9; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>신청이 접수되었습니다</h1>
    <p th:text="${myApplication.activityTitle} + ' / ' + ${myApplication.participationDate}"></p>
    <p class="notice">문자/이메일로 조회 링크를 보내드립니다. 해당 링크로 언제든 신청 상태를 확인하고 취소할 수 있습니다.</p>
    <p><a th:href="@{/apply/{token}(token=${myApplication.token})}">지금 조회하기</a></p>
    <p><a th:href="@{/activities}">활동 목록으로</a></p>
</body>
</html>
