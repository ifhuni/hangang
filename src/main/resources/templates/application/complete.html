<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>신청 완료 - 한강웹</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --success: #1e8449;
            --success-soft: #e9f7ef;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 80px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 480px; margin: 0 auto; }

        .topbar { padding-block: 20px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
        }
        .check-badge {
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--success-soft); color: var(--success);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 16px;
        }
        h1 { margin: 0 0 6px; font-size: 20px; }
        .sub { margin: 0 0 20px; font-size: 13.5px; color: var(--text-muted); }

        .summary { background: var(--ground); border-radius: 12px; padding: 16px; text-align: left; margin-bottom: 18px; }
        .summary .title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .summary .date { font-size: 13.5px; color: var(--accent); font-weight: 600; }

        .notice {
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 24px;
        }

        .actions { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { filter: brightness(1.06); }
        .btn-secondary { background: var(--ground); color: var(--text); border: 1px solid var(--border); }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); text-align: center; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand">한강<span>웹</span></div>
    </div>

    <div class="card">
        <div class="check-badge">✓</div>
        <h1>신청이 접수되었습니다</h1>
        <p class="sub">업체 확인 후 참여 여부가 결정됩니다.</p>

        <div class="summary">
            <div class="title" th:text="${myApplication.activityTitle}"></div>
            <div class="date" th:text="'참여일 ' + ${myApplication.participationDate}"></div>
        </div>

        <p class="notice">📩 문자/이메일로 조회 링크를 보내드립니다. 해당 링크로 언제든 신청 상태를 확인하고 취소할 수 있습니다.</p>

        <div class="actions">
            <a class="btn btn-primary" th:href="@{/apply/{token}(token=${myApplication.token})}">지금 조회하기</a>
            <a class="btn btn-secondary" th:href="@{/activities}">활동 목록으로</a>
        </div>
    </div>

    <footer>한강웹</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
