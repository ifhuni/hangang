<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${activity.title} + ' 참여 신청 - 한강웹'"></title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: #c0392b; font-size: 13px; margin-top: 4px; }
        button { padding: 10px 20px; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
    <p><a th:href="@{/activities/{id}(id=${activity.activityId})}">← 활동으로 돌아가기</a></p>
    <h1 th:text="${activity.title} + ' 참여 신청'"></h1>

    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <form th:action="@{/activities/{id}/apply(id=${activity.activityId})}" th:object="${applicationForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label>이름</label>
            <input type="text" th:field="*{applicantName}">
            <div class="error" th:if="${#fields.hasErrors('applicantName')}" th:errors="*{applicantName}"></div>
        </div>
        <div class="field">
            <label>연락처</label>
            <input type="text" th:field="*{phone}">
            <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="field">
            <label>이메일</label>
            <input type="email" th:field="*{email}">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="field">
            <label>성별</label>
            <select th:field="*{gender}">
                <option value="">선택</option>
                <option value="M">남성</option>
                <option value="F">여성</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
        </div>
        <div class="field">
            <label>참여 희망 날짜</label>
            <input type="date" th:field="*{participationDate}"
                   th:min="${activity.activityStartDate}" th:max="${activity.activityEndDate}">
            <div class="error" th:if="${#fields.hasErrors('participationDate')}" th:errors="*{participationDate}"></div>
        </div>

        <button type="submit">신청하기</button>
    </form>
    <th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
