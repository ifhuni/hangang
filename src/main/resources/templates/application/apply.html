<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${activity.title} + ' 참여 신청 - 한강웹'"></title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --error: #c0392b;
            --error-soft: #fbeceb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 80px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { max-width: 560px; margin: 0 auto; }

        .topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 20px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span { color: var(--accent); }

        .back-link { display: inline-block; margin-bottom: 14px; font-size: 13.5px; color: var(--text-muted); }
        .back-link:hover { color: var(--accent); }

        h1 { margin: 0 0 20px; font-size: 21px; line-height: 1.4; text-wrap: balance; }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .summary-card .vendor { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
        .summary-card .title { font-size: 15.5px; font-weight: 700; }
        .summary-card .price { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .date-badge {
            flex: none;
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 800;
            font-size: 13.5px;
            padding: 8px 14px;
            border-radius: 10px;
            text-align: center;
        }
        .date-badge small { display: block; font-size: 10.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }

        .error-banner {
            background: var(--error-soft);
            color: var(--error);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13.5px;
            margin-bottom: 16px;
        }

        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px clamp(18px, 4vw, 28px); }
        .field { margin-bottom: 18px; }
        .field:last-of-type { margin-bottom: 0; }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--text); }
        .field input, .field select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--text);
            background: var(--ground);
        }
        .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .field-error { color: var(--error); font-size: 12.5px; margin-top: 5px; }
        .radio-group { display: flex; gap: 10px; }
        .radio-option {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            background: var(--ground);
            position: relative;
        }
        .radio-option input { position: absolute; opacity: 0; }
        .radio-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }

        .submit-btn {
            width: 100%;
            margin-top: 24px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 15.5px;
            font-weight: 700;
            padding: 13px 0;
            cursor: pointer;
        }
        .submit-btn:hover { filter: brightness(1.06); }

        footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand">한강<span>웹</span></div>
    </div>

    <a class="back-link" th:href="@{/activities/{id}(id=${activity.activityId})}">← 활동으로 돌아가기</a>

    <h1>참여 신청</h1>

    <div class="summary-card">
        <div>
            <div class="vendor" th:text="${activity.vendorBusinessName}"></div>
            <div class="title" th:text="${activity.title}"></div>
            <div class="price" th:text="${#numbers.formatInteger(activity.price, 0, 'COMMA')} + '원 / 1인'"></div>
        </div>
        <div class="date-badge" th:if="${applicationForm.participationDate != null}">
            <small>참여일</small>
            <span th:text="${#temporals.format(applicationForm.participationDate, 'M.d')}"></span>
        </div>
    </div>

    <p th:if="${errorMessage}" class="error-banner" th:text="${errorMessage}"></p>

    <div class="form-card">
        <form th:action="@{/activities/{id}/apply(id=${activity.activityId})}" th:object="${applicationForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="applicantName">이름</label>
                <input type="text" id="applicantName" th:field="*{applicantName}" placeholder="홍길동">
                <div class="field-error" th:if="${#fields.hasErrors('applicantName')}" th:errors="*{applicantName}"></div>
            </div>
            <div class="field">
                <label for="phone">연락처</label>
                <input type="text" id="phone" th:field="*{phone}" placeholder="010-0000-0000">
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" id="email" th:field="*{email}" placeholder="example@email.com">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label>성별</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" th:field="*{gender}" value="M"> 남성
                    </label>
                    <label class="radio-option">
                        <input type="radio" th:field="*{gender}" value="F"> 여성
                    </label>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
            </div>
            <div class="field">
                <label for="participationDate">참여 희망 날짜</label>
                <input type="date" id="participationDate" th:field="*{participationDate}"
                       th:min="${activity.activityStartDate}" th:max="${activity.activityEndDate}">
                <div class="field-error" th:if="${#fields.hasErrors('participationDate')}" th:errors="*{participationDate}"></div>
            </div>

            <button type="submit" class="submit-btn">신청하기</button>
        </form>
    </div>

    <footer>한강웹 · 신청 완료 후 조회 링크가 문자/이메일로 발송됩니다.</footer>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
