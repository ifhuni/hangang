<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{application.lookupSearch.heading} + ' - ' + #{common.footer.brand}">내 신청 조회 - 한강활동</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --error: #c0392b;
            --error-soft: #fbeceb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { width: 100%; max-width: 400px; }

        .brand { text-align: center; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
        .brand span:last-child { color: var(--accent); margin-left: 2px; }
        .lang-switch { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 24px; }
        .lang-btn { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
        .lang-btn.active { color: var(--accent); font-weight: 800; }
        .lang-btn:hover { color: var(--accent); }
        .lang-sep { font-size: 11px; color: var(--border); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px clamp(20px, 5vw, 34px); }
        h1 { margin: 0 0 4px; font-size: 19px; text-align: center; }
        .sub { margin: 0 0 22px; font-size: 13px; color: var(--text-muted); text-align: center; line-height: 1.6; }

        .banner { background: var(--error-soft); color: var(--error); border-radius: 10px; padding: 11px 14px; font-size: 13px; margin-bottom: 18px; }

        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
        .field input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--text);
            background: var(--ground);
        }
        .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

        .submit-btn {
            width: 100%;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 0;
            cursor: pointer;
        }
        .submit-btn:hover { filter: brightness(1.06); }

        .home-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
        .home-link a { color: var(--accent); font-weight: 700; }
        .home-link a:hover { text-decoration: underline; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">
    <div class="brand"><span th:text="#{common.brand.prefix}">한강</span><span th:text="#{common.brand.suffix}">활동</span></div>
    <th:block th:replace="~{fragments/layout :: langSwitcher}"></th:block>

    <div class="card">
        <h1 th:text="#{application.lookupSearch.heading}">내 신청 조회</h1>
        <p class="sub" th:utext="#{application.lookupSearch.subheading}">신청 시 입력한 이름·연락처·이메일로<br>내 참여 신청 내역을 조회할 수 있습니다.</p>

        <p th:if="${errorMessage}" class="banner" th:text="${errorMessage}"></p>

        <form th:action="@{/apply/lookup}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="field">
                <label for="applicantName" th:text="#{application.lookupSearch.name}">이름</label>
                <input type="text" id="applicantName" name="applicantName" th:placeholder="#{application.apply.namePlaceholder}">
            </div>
            <div class="field">
                <label for="phone" th:text="#{application.lookupSearch.phone}">연락처</label>
                <input type="text" id="phone" name="phone" th:placeholder="#{application.apply.phonePlaceholder}">
            </div>
            <div class="field">
                <label for="email" th:text="#{application.lookupSearch.email}">이메일</label>
                <input type="email" id="email" name="email" th:placeholder="#{application.apply.emailPlaceholder}">
            </div>
            <button type="submit" class="submit-btn" th:text="#{application.lookupSearch.submit}">조회하기</button>
        </form>

        <p class="home-link" th:text="#{application.lookupSearch.hasLinkNotice}">조회 링크를 문자/이메일로 받으셨나요? 해당 링크로 바로 접속해주세요.</p>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
