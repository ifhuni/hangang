<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{application.lookupResults.heading} + ' - ' + #{common.footer.brand}">내 신청 조회 - 한강활동</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --pending: #b7950b;
            --pending-soft: #fbf3d9;
            --approved: #1e8449;
            --approved-soft: #e9f7ef;
            --cancelled: #7f8c8d;
            --cancelled-soft: #eceeee;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 24px 16px 80px;
        }
        a { color: inherit; text-decoration: none; }
        .wrap { width: 100%; max-width: 480px; margin: 0 auto; }

        .brand { text-align: center; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
        .brand span:last-child { color: var(--accent); margin-left: 2px; }
        .lang-switch { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 24px; }
        .lang-btn { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
        .lang-btn.active { color: var(--accent); font-weight: 800; }
        .lang-btn:hover { color: var(--accent); }
        .lang-sep { font-size: 11px; color: var(--border); }

        h1 { margin: 0 0 4px; font-size: 19px; text-align: center; }
        .sub { margin: 0 0 22px; font-size: 13px; color: var(--text-muted); text-align: center; }

        .result-list { display: flex; flex-direction: column; gap: 10px; }
        .result-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .result-card:hover { border-color: var(--accent); }
        .result-card .title { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
        .result-card .date { font-size: 12.5px; color: var(--text-muted); }
        .status { flex: none; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
        .status-PENDING { background: var(--pending-soft); color: var(--pending); }
        .status-APPROVED { background: var(--approved-soft); color: var(--approved); }
        .status-CANCELLED { background: var(--cancelled-soft); color: var(--cancelled); }

        .home-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
        .home-link a { color: var(--accent); font-weight: 700; }
        .home-link a:hover { text-decoration: underline; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">
    <div class="brand"><span th:text="#{common.brand.prefix}">한강</span><span th:text="#{common.brand.suffix}">활동</span></div>
    <th:block th:replace="~{fragments/layout :: langSwitcher}"></th:block>

    <h1 th:text="#{application.lookupResults.heading}">내 신청 조회</h1>
    <p class="sub" th:text="#{application.lookupResults.subheading(${#lists.size(matches)})}"></p>

    <div class="result-list">
        <a class="result-card" th:each="app : ${matches}" th:href="@{/apply/{token}(token=${app.token})}">
            <div>
                <div class="title" th:text="${app.activityTitle}"></div>
                <div class="date" th:text="#{application.lookupResults.dateLabel} + ' ' + ${app.participationDate}"></div>
            </div>
            <span th:class="'status status-' + ${app.status}"
                  th:text="${app.status == 'PENDING'} ? #{common.status.pending} : (${app.status == 'APPROVED'} ? #{common.status.approved} : #{common.status.cancelled})"></span>
        </a>
    </div>

    <p class="home-link"><a th:href="@{/apply/lookup}" th:text="#{application.lookupResults.searchAgain}">다시 조회하기</a></p>
</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
