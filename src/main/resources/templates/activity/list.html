<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{activityList.title} + ' - ' + #{common.footer.brand}">활동 목록 - 한강활동</title>
    <style>
        :root {
            --ground: #f6f7f9;
            --surface: #ffffff;
            --border: #e3e6ea;
            --text: #1f2a37;
            --text-muted: #6b7684;
            --accent: #2980b9;
            --accent-soft: #eaf2fc;
            --chip: #eef1f4;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
            padding: 0 16px 64px;
        }
        a { color: inherit; text-decoration: none; }
        .card, .card * { text-decoration: none; }
        .wrap { max-width: 1080px; margin: 0 auto; }

        .topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 20px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .brand span:last-child { color: var(--accent); margin-left: 2px; }
        .topnav { display: flex; align-items: center; gap: 2px; font-size: 13.5px; }
        .topnav a { color: var(--text-muted); font-weight: 600; padding: 7px 12px; border-radius: 8px; }
        .topnav a:hover { background: var(--accent-soft); color: var(--accent); }
        .lang-switch { display: flex; align-items: center; gap: 6px; margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--border); }
        .lang-btn { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
        .lang-btn.active { color: var(--accent); font-weight: 800; }
        .lang-btn:hover { color: var(--accent); }
        .lang-sep { font-size: 11px; color: var(--border); }

        .page-head { margin-top: 8px; margin-bottom: 18px; }
        .page-head h1 { margin: 0 0 4px; font-size: 22px; }
        .page-head p { margin: 0; font-size: 13.5px; color: var(--text-muted); }

        .filter-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: grid;
            grid-template-columns: 150px 110px 1fr auto;
            gap: 10px;
            align-items: end;
        }
        @media (max-width: 720px) {
            .filter-bar { grid-template-columns: 1fr 1fr; }
            .filter-bar .field:nth-child(3) { grid-column: 1 / -1; }
            .filter-bar button { grid-column: 1 / -1; }
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; }
        .field input {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--ground);
        }
        .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .filter-bar button {
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 14.5px;
            font-weight: 700;
            padding: 10px 24px;
            cursor: pointer;
        }
        .filter-bar button:hover { filter: brightness(1.06); }

        .active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--accent-soft); color: var(--accent);
            font-size: 12.5px; font-weight: 600;
            padding: 5px 10px 5px 12px; border-radius: 999px;
        }
        .chip a { color: var(--accent); font-size: 13px; line-height: 1; }
        .chip a:hover { opacity: .7; }

        .result-row { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 14px; flex-wrap: wrap; gap: 8px; }
        .result-count { font-size: 14px; font-weight: 700; }
        .result-count span { color: var(--accent); }
        .sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
        .sort select {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 13px;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
        }

        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 16px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
        }
        .card:hover { border-color: var(--accent); box-shadow: 0 8px 20px -8px rgba(41,128,185,.35); transform: translateY(-2px); }
        .card-thumb { aspect-ratio: 16/10; object-fit: cover; border-radius: 10px 10px 0 0; margin: -16px -16px 0; width: calc(100% + 32px); }
        .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .vendor { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); flex: none; }
        .badge.spots-low { background: #fdeee0; color: #c0651a; }
        .card h3 { margin: 0; font-size: 16px; line-height: 1.35; }
        .card .meta-row { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--text-muted); }
        .card-foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: auto; padding-top: 4px; border-top: 1px dashed var(--border); }
        .price { font-size: 17px; font-weight: 800; color: var(--text); }
        .price small { font-size: 12px; font-weight: 500; color: var(--text-muted); }
        .view-link { font-size: 12.5px; font-weight: 700; color: var(--accent); }

        .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; padding: 60px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
    </style>
    <th:block th:replace="~{fragments/layout :: css}"></th:block>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="brand"><span th:text="#{common.brand.prefix}">한강</span><span th:text="#{common.brand.suffix}">활동</span></div>
        <nav class="topnav">
            <a th:href="@{/}" th:text="#{common.nav.home}">홈</a>
            <a th:href="@{/apply/lookup}" th:text="#{common.nav.myApplications}">내 신청 조회</a>
            <a th:href="@{/vendor/login}" th:text="#{common.nav.vendorLogin}">업체 로그인</a>
            <th:block th:replace="~{fragments/layout :: langSwitcher}"></th:block>
        </nav>
    </div>

    <div class="page-head">
        <h1 th:text="#{activityList.heading}">활동 목록</h1>
        <p th:text="#{activityList.subheading}">한강에서 즐길 수 있는 다양한 체험 활동을 찾아보세요.</p>
    </div>

    <form class="filter-bar" th:action="@{/activities}" method="get">
        <div class="field">
            <label for="date" th:text="#{activityList.filter.date}">참여 날짜</label>
            <input type="date" id="date" name="date" th:value="${date}">
        </div>
        <div class="field">
            <label for="headcount" th:text="#{activityList.filter.headcount}">인원수</label>
            <input type="number" id="headcount" name="headcount" min="1" th:value="${headcount}">
        </div>
        <div class="field">
            <label for="keyword" th:text="#{activityList.filter.keyword}">활동명</label>
            <input type="text" id="keyword" name="keyword" th:placeholder="#{activityList.filter.keyword.placeholder}" th:value="${keyword}">
        </div>
        <button type="submit" th:text="#{activityList.filter.submit}">검색</button>
    </form>

    <div class="active-filters" th:if="${date != null or headcount != null or (keyword != null and !keyword.isEmpty())}">
        <span class="chip" th:if="${date != null}">
            <span th:text="#{activityList.chip.dateSuffix(${date})}"></span>
            <a th:href="@{/activities(headcount=${headcount}, keyword=${keyword})}" th:aria-label="#{activityList.chip.removeDate}">×</a>
        </span>
        <span class="chip" th:if="${headcount != null}">
            <span th:text="#{activityList.chip.headcountSuffix(${headcount})}"></span>
            <a th:href="@{/activities(date=${date}, keyword=${keyword})}" th:aria-label="#{activityList.chip.removeHeadcount}">×</a>
        </span>
        <span class="chip" th:if="${keyword != null and !keyword.isEmpty()}">
            <span th:text="'&quot;' + ${keyword} + '&quot;'"></span>
            <a th:href="@{/activities(date=${date}, headcount=${headcount})}" th:aria-label="#{activityList.chip.removeKeyword}">×</a>
        </span>
    </div>

    <div class="result-row">
        <div class="result-count" th:text="#{activityList.resultCount(${#lists.size(activities)})}">검색 결과 0건</div>
        <form class="sort" th:action="@{/activities}" method="get">
            <input type="hidden" name="date" th:if="${date != null}" th:value="${date}">
            <input type="hidden" name="headcount" th:if="${headcount != null}" th:value="${headcount}">
            <input type="hidden" name="keyword" th:if="${keyword != null}" th:value="${keyword}">
            <span th:text="#{activityList.sort.label}">정렬</span>
            <select name="sort" onchange="this.form.submit()">
                <option value="latest" th:selected="${sort == null or sort == 'latest'}" th:text="#{activityList.sort.latest}">최신 등록순</option>
                <option value="soon" th:selected="${sort == 'soon'}" th:text="#{activityList.sort.soon}">참여일 임박순</option>
                <option value="price_asc" th:selected="${sort == 'price_asc'}" th:text="#{activityList.sort.priceAsc}">가격 낮은순</option>
                <option value="price_desc" th:selected="${sort == 'price_desc'}" th:text="#{activityList.sort.priceDesc}">가격 높은순</option>
            </select>
        </form>
    </div>

    <p th:if="${#lists.isEmpty(activities)}" class="empty" th:text="#{activityList.empty}">조건에 맞는 활동이 없습니다. 날짜나 인원수를 조정해보세요.</p>

    <div class="cards" th:unless="${#lists.isEmpty(activities)}">
        <a class="card" th:each="activity : ${activities}" th:href="@{/activities/{id}(id=${activity.activityId})}"
           th:with="remaining=${remainingByActivityId != null} ? ${remainingByActivityId.get(activity.activityId)} : null">
            <img th:if="${activity.imagePath != null}" th:src="@{${activity.imagePath}}" class="card-thumb" alt="">
            <div class="card-top">
                <span class="vendor" th:text="${activity.vendorBusinessName}"></span>
                <span class="badge" th:classappend="${remaining != null and remaining <= 3} ? 'spots-low' : ''"
                      th:text="${remaining == null} ? #{activityList.badge.open} : (${remaining <= 0} ? #{activityList.badge.full} : #{activityList.badge.remaining(${remaining})})"></span>
            </div>
            <h3 th:text="${activity.title}"></h3>
            <div class="meta-row">
                <span th:text="'📅 ' + ${activity.activityStartDate} + ' – ' + ${activity.activityEndDate}"></span>
                <span th:text="'👥 ' + #{activityList.card.capacity(${activity.dailyCapacity})}"></span>
                <span th:if="${activity.location != null and !activity.location.isEmpty()}" th:text="'📍 ' + ${activity.location}"></span>
            </div>
            <div class="card-foot">
                <div class="price">
                    <span th:text="${#numbers.formatInteger(activity.price, 0, 'COMMA')} + ' ' + #{common.currency.krw}"></span>
                    <small th:text="'&nbsp;' + #{activityList.card.perPerson}">&nbsp;/ 1인</small>
                </div>
                <span class="view-link" th:text="#{activityList.card.viewMore}">자세히 보기 →</span>
            </div>
        </a>
    </div>

</div>
<th:block th:replace="~{fragments/layout :: js}"></th:block>
</body>
</html>
